name = "bppl"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Bppl"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = true
relaxedAutoImplicit = true
linter.style.lambdaSyntax = false
weak.linter.mathlibStandardSet = true
linter.style.openClassical = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.28.0"

[[require]]
name = "iris"
scope = "leanprover-community"
rev = "v4.28.0"

[[lean_lib]]
name = "Bppl"
